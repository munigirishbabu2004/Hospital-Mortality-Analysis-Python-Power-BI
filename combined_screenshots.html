<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Mortality Analysis - Screenshots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 20px;
        }
        
        .screenshot-section {
            margin-bottom: 50px;
        }
        
        .screenshot-section:last-child {
            margin-bottom: 0;
        }
        
        .screenshot-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .screenshot-container {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .screenshot-container img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
        
        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hospital Mortality Analysis</h1>
            <p>Python & Power BI - Combined Screenshots</p>
        </div>
        
        <div class="content">
            <div class="two-column">
                <div class="screenshot-section">
                    <h2 class="screenshot-title">Screenshot 1</h2>
                    <div class="screenshot-container">
                        <img src="Screenshot 2026-09-06 223812.png" alt="Hospital Mortality Analysis Screenshot 1">
                    </div>
                </div>
                
                <div class="screenshot-section">
                    <h2 class="screenshot-title">Screenshot 2</h2>
                    <div class="screenshot-container">
                        <img src="Screenshot 2026-09-06 202505.png" alt="Hospital Mortality Analysis Screenshot 2">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>📊 Hospital Mortality Analysis - Data Insights and Visualizations</p>
            <p>Repository: <a href="https://github.com/munigirishbabu2004/Hospital-Mortality-Analysis-Python-Power-BI">Hospital-Mortality-Analysis-Python-Power-BI</a></p>
        </div>
    </div>
</body>
</html>
